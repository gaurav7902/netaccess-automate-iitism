name: Build desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: NetAccessDesktop-linux
          - os: windows-latest
            artifact: NetAccessDesktop-windows
          - os: macos-latest
            artifact: NetAccessDesktop-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip . pyinstaller pytest
      - name: Run tests
        run: python -m pytest
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --windowed --name NetAccessDesktop --paths src src/netaccess/main.py
      - name: Archive Linux build
        if: runner.os == 'Linux'
        run: tar -czf NetAccessDesktop-linux.tar.gz -C dist NetAccessDesktop
      - name: Archive Windows build
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/NetAccessDesktop -DestinationPath NetAccessDesktop-windows.zip
        shell: pwsh
      - name: Archive macOS build
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/NetAccessDesktop.app NetAccessDesktop-macos.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            NetAccessDesktop-linux.tar.gz
            NetAccessDesktop-windows.zip
            NetAccessDesktop-macos.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
