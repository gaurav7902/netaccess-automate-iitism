[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netaccess-desktop"
version = "0.1.0"
description = "Cross-platform desktop helper for IIT ISM NetAccess authentication"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NetAccess Desktop contributors" }]
dependencies = [
  "PySide6>=6.7,<7",
  "requests>=2.31,<3",
  "keyring>=25,<26",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5"]

[project.scripts]
netaccess-desktop = "netaccess.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
